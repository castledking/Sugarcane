name: Build Release

on:
  push:
    tags:
      - 'Build #'  # Matches tags like "Build #5"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache paperweight
        uses: actions/cache@v4
        with:
          path: .gradle/caches/paperweight/default-cache-key
          key: default-cache-key-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Configure Git info (required for Paper patcher)
        run: |
          git config --global user.email "ci@sugarcane.internal"
          git config --global user.name "Sugarcane CI"

      - name: Extract build number from tag
        id: extract
        run: |
          # Tag format: "Build #5"
          BUILD_NUM=${GITHUB_REF#refs/tags/Build\ #}
          {
            echo "build_num=${BUILD_NUM}"
          } >> "$GITHUB_OUTPUT"

      - name: Build Paperclip Jar
        id: build
        run: |
          ./gradlew applyPatches
          BUILD_NUMBER=${{ steps.extract.outputs.build_num }} ./gradlew createPaperclipJar
          JAR_NAME="sugarcane-26.1.2-${{ steps.extract.outputs.build_num }}.jar"
          mv paper-server/build/libs/paper-paperclip-*.jar "paper-server/build/libs/${JAR_NAME}"
          {
            echo "jar_name=${JAR_NAME}"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare release body
        run: |
          cat > release_body.md << 'EOF'
          ## Sugarcane Build #${{ steps.extract.outputs.build_num }}
          
          **Version:** 26.1.2
          **Build:** #${{ steps.extract.outputs.build_num }}
          
          ### Downloads
          - `sugarcane-26.1.2-${{ steps.extract.outputs.build_num }}.jar`
          
          ### Requirements
          - Java 21+
          - Paper API 26.1.2
          
          ### Installation
          Replace your existing Paper jar with this file. All Paper plugins and configurations are compatible.
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: "Sugarcane 26.1.2 Build #${{ steps.extract.outputs.build_num }}"
          body_path: release_body.md
          files: paper-server/build/libs/${{ steps.build.outputs.jar_name }}
          make_latest: true
          token: ${{ secrets.GITHUB_TOKEN }}
