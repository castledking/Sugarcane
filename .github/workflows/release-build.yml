name: Build Release

on:
  push:
    tags:
      - 'build-*'  # Matches tags like "build-5"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache paperweight
        uses: actions/cache@v4
        with:
          path: .gradle/caches/paperweight/default-cache-key
          key: default-cache-key-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Configure Git info (required for Paper patcher)
        run: |
          git config --global user.email "ci@sugarcane.internal"
          git config --global user.name "Sugarcane CI"

      - name: Extract build number from tag
        id: extract
        run: |
          # Tag format: "build-5"
          BUILD_NUM=${GITHUB_REF#refs/tags/build-}
          {
            echo "build_num=${BUILD_NUM}"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve Minecraft version
        id: version
        run: |
          # Single source of truth, so releases never drift from the version we actually build
          MC_VERSION=$(grep -E '^mcVersion=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          if [ -z "$MC_VERSION" ]; then
            echo "::error::Could not read mcVersion from gradle.properties"
            exit 1
          fi
          echo "Building Minecraft ${MC_VERSION}"
          {
            echo "mc_version=${MC_VERSION}"
          } >> "$GITHUB_OUTPUT"

      - name: Build Paperclip Jar
        id: build
        run: |
          ./gradlew applyPatches
          BUILD_NUMBER=${{ steps.extract.outputs.build_num }} ./gradlew createPaperclipJar
          JAR_NAME="sugarcane-${{ steps.version.outputs.mc_version }}-${{ steps.extract.outputs.build_num }}.jar"
          # settings.gradle.kts names this "<mcVersion>.build.<num>-<channel>" when BUILD_NUMBER is set
          SRC="paper-server/build/libs/paper-paperclip-${{ steps.version.outputs.mc_version }}.build.${{ steps.extract.outputs.build_num }}-"*.jar
          # shellcheck disable=SC2086
          if [ "$(ls -1 $SRC 2>/dev/null | wc -l)" -ne 1 ]; then
            echo "::error::Expected exactly one paperclip jar matching $SRC"
            ls -la paper-server/build/libs/ || true
            exit 1
          fi
          # shellcheck disable=SC2086
          mv $SRC "paper-server/build/libs/${JAR_NAME}"
          {
            echo "jar_name=${JAR_NAME}"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare release body
        run: |
          cat > release_body.md << 'EOF'
          ## Sugarcane Build #${{ steps.extract.outputs.build_num }}
          
          **Version:** ${{ steps.version.outputs.mc_version }}
          **Build:** #${{ steps.extract.outputs.build_num }}

          ### Downloads
          - `${{ steps.build.outputs.jar_name }}`

          ### Requirements
          - Java 25+
          - Paper API ${{ steps.version.outputs.mc_version }}
          
          ### Installation
          Replace your existing Paper jar with this file. All Paper plugins and configurations are compatible.
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: "Sugarcane ${{ steps.version.outputs.mc_version }} Build #${{ steps.extract.outputs.build_num }}"
          body_path: release_body.md
          files: paper-server/build/libs/${{ steps.build.outputs.jar_name }}
          make_latest: true
          token: ${{ secrets.GITHUB_TOKEN }}
